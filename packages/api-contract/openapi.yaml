openapi: 3.1.0
info:
  title: Orbit API
  version: 1.0.0
  description: Versioned contract for the Orbit campus events MVP.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /health:
    get:
      summary: API health
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: orbit-api }
                  timestamp: { type: string, format: date-time }
  /events:
    get:
      summary: Discover published events
      parameters:
        - { in: query, name: campus, schema: { type: string, enum: [my_campus, all_campuses] } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        '200':
          description: Event page
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  nextCursor: { type: [string, 'null'] }
  /events/{eventId}:
    get:
      summary: Read event details
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string } }
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404':
          description: Event not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Event:
      type: object
      required: [id, title, description, category, format, startsAt, endsAt, registrationMode, club]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        format: { type: string, enum: [in_person, online, hybrid] }
        venue: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        registrationDeadline: { type: [string, 'null'], format: date-time }
        capacity: { type: [integer, 'null'], minimum: 1 }
        registrationMode: { type: string, enum: [native, external] }
        externalUrl: { type: [string, 'null'], format: uri }
        posterUrl: { type: [string, 'null'], format: uri }
        club:
          type: object
          required: [id, name, college]
          properties:
            id: { type: string }
            name: { type: string }
            college: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
