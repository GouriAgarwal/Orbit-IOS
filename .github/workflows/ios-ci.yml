name: iOS CI
on:
  push:
    paths: ['apps/ios/**']
  pull_request:
    paths: ['apps/ios/**']
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - run: swift build
        working-directory: apps/ios
