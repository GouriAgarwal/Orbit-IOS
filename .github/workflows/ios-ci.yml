name: iOS CI
on:
  push:
    paths: ['apps/ios/**']
  pull_request:
    paths: ['apps/ios/**']
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build iOS app for Simulator
        run: >-
          xcodebuild
          -project apps/ios/Orbit.xcodeproj
          -target Orbit
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
